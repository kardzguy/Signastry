<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Signastry setup code</title>
<style>body{margin:0;font:17px/1.5 -apple-system,system-ui,sans-serif;background:#fff;color:#0E1726;padding:20px 16px}h1{font-size:24px;margin:0 0 8px}p{margin:0 0 14px;color:#4A5565}button{all:unset;display:block;text-align:center;background:#1778B0;color:#fff;font-weight:800;font-size:22px;padding:18px;border-radius:10px;cursor:pointer;margin:14px 0}button.ok{background:#1F8A4C}textarea{width:100%;box-sizing:border-box;height:260px;font:13px/1.4 ui-monospace,Menlo,monospace;border:1px solid #D6DCE4;border-radius:8px;padding:10px}</style></head><body>
<h1>Private lists: setup code</h1><p>Safe to run more than once.</p><p>1. Tap the big button to copy the code.<br>2. Go back to Supabase, hold your finger in the empty SQL box, tap <b>Paste</b>.<br>3. Tap the green <b>Run</b> button.</p>
<button id="cp" type="button">Copy the code</button>
<textarea id="sql" readonly>create table if not exists public.tester_signups (
  id bigint generated always as identity primary key,
  created_at timestamptz not null default now(),
  member_code text not null unique,
  display_name text not null check (char_length(display_name) between 1 and 120),
  email text not null check (char_length(email) between 5 and 200 and email like &#x27;%_@_%._%&#x27;)
);

alter table public.tester_signups enable row level security;

drop policy if exists &quot;testers can add themselves&quot; on public.tester_signups;
create policy &quot;testers can add themselves&quot; on public.tester_signups
  for insert to anon, authenticated with check (true);

revoke select, update, delete on public.tester_signups from anon, authenticated;
grant insert on public.tester_signups to anon, authenticated;

create table if not exists public.private_contacts (
  id bigint generated always as identity primary key,
  created_at timestamptz not null default now(),
  ref text not null unique,
  kind text not null,
  owner text,
  name text,
  contact text,
  details text
);
alter table public.private_contacts enable row level security;
drop policy if exists &quot;site can add contacts&quot; on public.private_contacts;
create policy &quot;site can add contacts&quot; on public.private_contacts
  for insert to anon, authenticated with check (true);
revoke select, update, delete on public.private_contacts from anon, authenticated;
grant insert on public.private_contacts to anon, authenticated;

create table if not exists public.site_visits (
  id bigint generated always as identity primary key,
  at timestamptz not null default now(),
  vid text not null check (char_length(vid) between 4 and 40),
  page text check (char_length(page) &lt;= 40),
  source text check (char_length(source) &lt;= 60),
  device text check (char_length(device) &lt;= 10)
);
alter table public.site_visits enable row level security;
drop policy if exists &quot;site can add visits&quot; on public.site_visits;
create policy &quot;site can add visits&quot; on public.site_visits
  for insert to anon, authenticated with check (true);
revoke select, update, delete on public.site_visits from anon, authenticated;
grant insert on public.site_visits to anon, authenticated;

drop function if exists public.visit_stats(int);
create or replace function public.visit_stats(days int, pin text)
returns json language sql security definer set search_path = public as $$
  with ok as (select md5(&#x27;signastry-staff:&#x27; || coalesce(pin,&#x27;&#x27;)) = &#x27;44054613cf4e09d5ca9863fa3ad532cc&#x27; as yes),
  p as (select now() - make_interval(days =&gt; least(greatest(coalesce(days,30),1),365)) as since),
  v as (select * from site_visits, p where at &gt; p.since),
  f as (select vid, min(at) as first_at from site_visits group by vid)
  select case when (select yes from ok) then json_build_object(
    &#x27;views&#x27;, (select count(*) from v where page &lt;&gt; &#x27;signed up&#x27;),
    &#x27;visitors&#x27;, (select count(distinct vid) from v),
    &#x27;new&#x27;, (select count(*) from f, p where f.first_at &gt; p.since),
    &#x27;signups&#x27;, (select count(*) from v where page = &#x27;signed up&#x27;),
    &#x27;daily&#x27;, (select coalesce(json_agg(d order by d.day), &#x27;[]&#x27;::json) from (
       select to_char(at at time zone &#x27;America/New_York&#x27;, &#x27;YYYY-MM-DD&#x27;) as day, count(distinct vid) as visitors, count(*) as views
       from v group by 1) d),
    &#x27;sources&#x27;, (select coalesce(json_agg(s), &#x27;[]&#x27;::json) from (
       select coalesce(source,&#x27;Unknown&#x27;) as name, count(distinct vid) as n from v group by 1 order by 2 desc limit 8) s),
    &#x27;pages&#x27;, (select coalesce(json_agg(s), &#x27;[]&#x27;::json) from (
       select coalesce(page,&#x27;Unknown&#x27;) as name, count(*) as n from v group by 1 order by 2 desc limit 8) s),
    &#x27;devices&#x27;, (select coalesce(json_agg(s), &#x27;[]&#x27;::json) from (
       select coalesce(device,&#x27;Unknown&#x27;) as name, count(distinct vid) as n from v group by 1 order by 2 desc) s)
  ) else null end;
$$;
revoke execute on function public.visit_stats(int, text) from public;
grant execute on function public.visit_stats(int, text) to anon, authenticated;
